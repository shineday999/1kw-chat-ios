<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="1kw Chat" />
<meta name="theme-color" content="#ec4899" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>1kw Chat</title>
<style>
  /* ==================================================================
     Design tokens — 死鬼要求字體再大一倍
     iPhone 主字 18→36px、標題 26→52px
     ================================================================== */
  :root {
    /* default = iPhone（小螢幕基線） */
    --fs-xs: 28px;
    --fs-sm: 30px;
    --fs-md: 36px;   /* 主字體：iPhone 36px（之前 18px，×2） */
    --fs-lg: 40px;
    --fs-xl: 52px;   /* 標題：52px */
    --sp-1: 12px;
    --sp-2: 24px;
    --sp-3: 32px;
    --sp-4: 40px;
    --radius-bubble: 32px;
    --radius-btn: 22px;
    /* 不寫死 header/composer 高度，改用 grid auto-rows */
    --send-btn-size: 88px;
    --max-w: 100%;
    --msg-max-w: 92%;
  }

  /* iPhone 大尺寸 (>= 414px) */
  @media (min-width: 414px) {
    :root {
      --fs-md: 38px;
      --fs-lg: 42px;
      --fs-xl: 56px;
      --sp-2: 28px;
      --sp-3: 36px;
      --sp-4: 44px;
      --radius-bubble: 36px;
      --send-btn-size: 96px;
      --msg-max-w: 88%;
    }
  }

  /* 平板 (>= 600px) */
  @media (min-width: 600px) {
    :root {
      --fs-md: 40px;
      --fs-lg: 44px;
      --fs-xl: 60px;
      --sp-2: 32px;
      --sp-3: 40px;
      --sp-4: 48px;
      --radius-bubble: 40px;
      --radius-btn: 26px;
      --send-btn-size: 104px;
      --max-w: 760px;
      --msg-max-w: 70%;
    }
  }

  /* iPad Pro (>= 900px) */
  @media (min-width: 900px) {
    :root {
      --fs-md: 42px;
      --fs-xl: 64px;
      --sp-3: 48px;
      --sp-4: 56px;
      --radius-bubble: 44px;
      --send-btn-size: 112px;
      --msg-max-w: 60%;
    }
  }

  /* 桌機 (>= 1024px) */
  @media (min-width: 1024px) {
    :root {
      --fs-md: 36px;
      --fs-lg: 40px;
      --fs-xl: 60px;
      --sp-3: 56px;
      --sp-4: 64px;
      --radius-bubble: 44px;
      --send-btn-size: 104px;
      --msg-max-w: 55%;
    }
  }

  /* 4K */
  @media (min-width: 1600px) {
    :root {
      --fs-md: 40px;
      --sp-3: 64px;
      --sp-4: 72px;
      --send-btn-size: 112px;
      --msg-max-w: 50%;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", sans-serif;
    font-size: var(--fs-md);
    line-height: 1.6;            /* 聊天內容用 1.6 行高舒服 */
    background: linear-gradient(135deg, #fdf2f8 0%, #fff7ed 50%, #fefce8 100%);
    color: #1f2937;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }

  /* ==================================================================
     App shell - 手機直立時垂直三段
     桌機 (≥768px) 改成兩欄：左 sidebar + 右 chat
     ================================================================== */
  #app {
    display: grid;
    height: 100vh; height: 100dvh;
    width: 100%;
    max-width: var(--max-w);
    margin: 0 auto;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    /* 自動計算各區高度，不寫死 px — 讓字體變大時不會擠爆 */
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    grid-template-areas: "header" "settings" "messages" "composer";
    transition: max-width 0.3s ease;
  }

  /* 平板 (≥768px) — 寬度放寬但仍單欄 */
  @media (min-width: 768px) {
    #app { max-width: 760px; }
  }

  /* 桌機 (≥1024px) — 兩欄版 */
  @media (min-width: 1024px) {
    #app {
      max-width: var(--max-w-wide);
      grid-template-columns: 320px 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "header header"
        "sidebar chat";
      gap: 0;
    }
    #sidebar { display: flex !important; }
    #settings-inline { display: none !important; }
  }

  /* 橫向手機 — 字體縮小 */
  @media (max-height: 500px) and (orientation: landscape) {
    :root {
      --fs-md: 22px;
      --fs-xl: 32px;
      --send-btn-size: 64px;
    }
  }

  /* ==================================================================
     Header
     ================================================================== */
  header {
    grid-area: header;
    display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(236,72,153,0.15);
    position: relative;
    z-index: 10;
    flex: 0 0 auto;
  }
  header h1 {
    margin: 0;
    font-size: var(--fs-xl);
    font-weight: 700;
    background: linear-gradient(135deg, #ec4899 0%, #fb923c 50%, #fbbf24 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap;
  }
  #status {
    margin-left: auto;
    font-size: var(--fs-xs);
    padding: clamp(3px, 0.8vw, 5px) clamp(8px, 2vw, 12px);
    border-radius: 999px;
    background: linear-gradient(135deg, #fce7f3, #fed7aa); color: #be185d;
    white-space: nowrap;
  }
  #status.online { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #047857; }
  #status.offline { background: linear-gradient(135deg, #fee2e2, #fecaca); color: #b91c1c; }
  #menu-btn {
    display: none; /* 桌機隱藏 */
    border: none; background: none; font-size: 22px;
    color: #ec4899; cursor: pointer; padding: 4px 8px;
  }
  @media (min-width: 1024px) { #menu-btn { display: none; } }

  /* ==================================================================
     Sidebar (桌機 ≥1024px 才顯示)
     ================================================================== */
  #sidebar {
    display: none;
    grid-area: sidebar;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-right: 1px solid rgba(236,72,153,0.15);
    padding: var(--sp-3);
    overflow-y: auto;
  }
  #sidebar h2 {
    margin: 0 0 var(--sp-2);
    font-size: var(--fs-md);
    color: #be185d;
    display: flex; align-items: center; justify-content: space-between;
  }
  #new-chat-btn {
    border: none; border-radius: var(--radius-btn);
    padding: 6px 12px; font-size: var(--fs-sm);
    background: linear-gradient(135deg, #ec4899, #fb923c);
    color: white; cursor: pointer; font-weight: 600;
  }
  #chat-list {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  .chat-item {
    padding: 10px 12px;
    border-radius: var(--radius-btn);
    cursor: pointer;
    font-size: var(--fs-sm);
    color: #4b5563;
    transition: background 0.15s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-item:hover { background: rgba(236,72,153,0.1); }
  .chat-item.active {
    background: linear-gradient(135deg, #fce7f3, #fed7aa);
    color: #be185d; font-weight: 600;
  }

  /* ==================================================================
     Settings (inline, 桌機時藏起來改放到 sidebar)
     ================================================================== */
  #settings-inline {
    grid-area: settings;
    padding: var(--sp-2) var(--sp-3);
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(0,0,0,0.05);
    display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center;
    font-size: var(--fs-sm);
    flex: 0 0 auto;
  }
  /* 摺疊時只顯示一條小按鈕列，節省空間 */
  #settings-inline.collapsed > :not(.settings-toggle) { display: none; }
  #settings-inline.collapsed .settings-toggle { width: 100%; }
  .settings-toggle {
    border: none; border-radius: var(--radius-btn);
    padding: var(--sp-2) var(--sp-3);
    font-size: var(--fs-sm);
    background: linear-gradient(135deg, #fce7f3, #fed7aa);
    color: #be185d; font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    gap: var(--sp-1);
  }
  .settings-toggle::before { content: "⚙ "; }
  .settings-toggle::after { content: " ▾"; transition: transform 0.2s; }
  #settings-inline:not(.collapsed) .settings-toggle::after { content: " ▴"; }
  #settings-inline label { color: #6b7280; font-size: var(--fs-xs); white-space: nowrap; }
  #settings-inline select,
  #settings-inline input[type="number"],
  #settings-inline input[type="text"] {
    border: 1px solid #fbcfe8; border-radius: var(--radius-btn);
    padding: clamp(4px, 1vw, 6px) clamp(6px, 1.5vw, 10px);
    font-size: var(--fs-sm); background: white;
    font-family: inherit;
    min-width: 0;
  }
  #settings-inline input[type="text"] {
    flex: 1; min-width: 160px; max-width: 280px;
  }
  #settings-inline input[type="number"] { width: clamp(50px, 12vw, 70px); }
  #settings-inline button {
    border: none; border-radius: var(--radius-btn);
    padding: clamp(4px, 1vw, 6px) clamp(8px, 2vw, 12px);
    font-size: var(--fs-xs); font-weight: 600;
    background: linear-gradient(135deg, #fce7f3, #fed7aa);
    color: #be185d; cursor: pointer;
    white-space: nowrap;
  }
  #settings-inline button:hover { transform: translateY(-1px); }
  #settings-inline details { width: 100%; }
  #settings-inline summary {
    cursor: pointer; color: #be185d;
    font-size: var(--fs-xs); padding: 4px 0;
    list-style: none;
  }
  #settings-inline summary::-webkit-details-marker { display: none; }
  #settings-inline summary::before { content: "▸ "; transition: transform 0.2s; display: inline-block; }
  #settings-inline details[open] summary::before { content: "▾ "; }
  .adv-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-top: var(--sp-1); }
  #settings-inline textarea {
    flex: 1; min-width: 200px;
    border: 1px solid #fbcfe8; border-radius: var(--radius-btn);
    padding: clamp(4px, 1vw, 6px); font-size: var(--fs-sm);
    font-family: inherit; resize: vertical;
  }

  /* ==================================================================
     Messages - 氣泡寬度跟著螢幕縮放
     ================================================================== */
  #messages {
    grid-area: messages;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: var(--sp-3);
    display: flex; flex-direction: column; gap: var(--sp-2);
    min-height: 0;       /* 讓 grid row 可以縮到小於內容 */
    flex: 1 1 0;
  }
  .msg {
    max-width: var(--msg-max-w);
    padding: var(--sp-2) var(--sp-3);
    border-radius: var(--radius-bubble);
    line-height: 1.5;
    font-size: var(--fs-md);
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: break-word;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    animation: msgIn 0.2s ease-out;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #ec4899 0%, #fb923c 100%);
    color: white; border-bottom-right-radius: 6px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: white; color: #1f2937; border-bottom-left-radius: 6px;
  }
  .msg.error { align-self: flex-start; background: #fee2e2; color: #b91c1c; }
  .msg.system {
    align-self: center;
    background: rgba(0,0,0,0.05); color: #6b7280;
    font-size: var(--fs-xs);
    padding: clamp(4px, 1vw, 8px) clamp(8px, 2vw, 12px);
  }
  .msg.pre {
    white-space: pre-wrap;
  }
  .msg pre { margin: 0; white-space: pre-wrap; font-family: inherit; }

  /* 程式碼區塊 */
  .msg pre code, .msg code {
    font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 0.92em;
    background: rgba(0,0,0,0.06);
    padding: 2px 5px;
    border-radius: 4px;
  }
  .msg pre code { display: block; padding: 10px; overflow-x: auto; background: rgba(0,0,0,0.04); }

  /* ==================================================================
     Composer
     ================================================================== */
  #composer {
    grid-area: composer;
    padding: var(--sp-2);
    padding-bottom: calc(var(--sp-2) + env(safe-area-inset-bottom));
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(236,72,153,0.15);
    display: flex; gap: var(--sp-2); align-items: stretch;
    flex: 0 0 auto;
  }
  #input {
    flex: 1;
    border: 1px solid #fbcfe8; border-radius: var(--radius-bubble);
    padding: var(--sp-2) var(--sp-3);
    font-size: var(--fs-md);
    font-family: inherit;
    background: white; color: #1f2937;
    resize: none;
    max-height: 30vh;
    min-height: var(--send-btn-size);
    line-height: 1.4;
    outline: none;
    -webkit-appearance: none; appearance: none;
  }
  #input:focus { border-color: #ec4899; box-shadow: 0 0 0 3px rgba(236,72,153,0.15); }
  #send {
    flex: 0 0 auto;
    width: var(--send-btn-size);
    height: var(--send-btn-size);
    border: none; border-radius: 50%;
    background: linear-gradient(135deg, #ec4899 0%, #fb923c 100%);
    color: white; font-size: var(--fs-xl); cursor: pointer;
    box-shadow: 0 4px 12px rgba(236,72,153,0.3);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s;
    align-self: flex-end;
  }
  #send:hover:not(:disabled) { transform: translateY(-1px); }
  #send:active:not(:disabled) { transform: scale(0.94); }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ==================================================================
     鍵盤彈出時自動調整（visualViewport API）
     ================================================================== */
  body.keyboard-open #app {
    height: calc(100vh - var(--kb-height, 0px));
    height: calc(100dvh - var(--kb-height, 0px));
  }

  /* 螢幕旋轉時容器自適應 */
  @media (orientation: landscape) and (max-height: 500px) {
    header h1 { font-size: var(--fs-md); }
  }

  /* 避免 hover 樣式在 iOS 觸發後黏住 */
  @media (hover: none) {
    .chat-item:hover { background: transparent; }
    #send:hover { transform: none; }
    #settings-inline button:hover { transform: none; }
  }

  /* dark mode (跟著系統) */
  @media (prefers-color-scheme: dark) {
    html, body { background: linear-gradient(135deg, #1f2937 0%, #111827 100%); color: #f3f4f6; }
    header, #settings-inline, #sidebar, #composer { background: rgba(31,41,55,0.7); color: #f3f4f6; }
    .msg.assistant { background: #374151; color: #f3f4f6; }
    .msg.system { background: rgba(255,255,255,0.05); color: #9ca3af; }
    #input { background: #374151; color: #f3f4f6; border-color: #4b5563; }
    #sidebar { border-right-color: rgba(255,255,255,0.1); }
    .chat-item { color: #d1d5db; }
    .chat-item.active { color: #fdf2f8; }
    #settings-inline label { color: #9ca3af; }
  }

  /* 桌面寬螢幕打字動畫 */
  .streaming-cursor::after { content: "▍"; animation: blink 1s infinite; color: #ec4899; }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

  /* 列印模式 */
  @media print {
    header, #settings-inline, #composer, #sidebar { display: none; }
    #messages { overflow: visible; height: auto; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="menu-btn" aria-label="menu">☰</button>
    <h1>1kw Chat</h1>
    <span id="status">連線中…</span>
  </header>

  <!-- 桌機 sidebar -->
  <aside id="sidebar">
    <h2>
      <span>對話</span>
      <button id="new-chat-btn">+ 新對話</button>
    </h2>
    <ul id="chat-list"></ul>
  </aside>

  <!-- 設定列（手機顯示 / 桌機藏） — 預設摺疊，只露一條 ⚙ 按鈕 -->
  <div id="settings-inline" class="collapsed">
    <button class="settings-toggle" type="button">設定 (API/模型/參數)</button>
    <label>API:</label>
    <input id="api-url" type="text" placeholder="http://100.117.83.39:8082/v1" />
    <label>Key:</label>
    <input id="api-key" type="text" placeholder="(可選)" style="max-width:140px;" />
    <button id="save">儲存</button>
    <button id="clear" type="button">清對話</button>
    <details>
      <summary>進階 (模型/參數)</summary>
      <div class="adv-row">
        <label>模型:</label>
        <input id="model" type="text" placeholder="(自動抓 /v1/models)" style="max-width:200px;" />
        <label>temp</label><input id="temp" type="number" step="0.05" min="0" max="2" value="0.6" />
        <label>top-p</label><input id="topp" type="number" step="0.05" min="0" max="1" value="0.95" />
        <label>max</label><input id="max" type="number" step="64" min="64" value="4096" />
      </div>
      <div class="adv-row" style="margin-top:var(--sp-1);">
        <label style="flex-basis:100%;">System:</label>
        <textarea id="system" rows="2">你是 1kw 的本地助手，回答簡潔。</textarea>
      </div>
    </details>
  </div>

  <div id="messages"></div>

  <div id="composer">
    <textarea id="input" placeholder="輸入訊息… (Shift+Enter 換行)" rows="1"></textarea>
    <button id="send" aria-label="送出">▶</button>
  </div>
</div>

<script>
(() => {
  // -------- State --------
  const LS = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const SS = (k, v) => localStorage.setItem(k, JSON.stringify(v));

  let cfg = LS("1kw-chat-cfg", {
    apiUrl: "http://100.117.83.39:8082/v1",
    apiKey: "qwen_local_access",
    model: "",
    temp: 0.6,
    topp: 0.95,
    max: 4096,
    system: "你是 1kw 的本地助手，回答簡潔。",
  });
  let chats = LS("1kw-chat-chats", [{ id: "default", title: "新對話", messages: [] }]);
  let currentChatId = LS("1kw-chat-current", "default");
  let models = [];
  let streaming = false;

  // -------- Elements --------
  const $ = (id) => document.getElementById(id);
  const apiUrl = $("api-url"), apiKey = $("api-key"), modelEl = $("model"),
        tempEl = $("temp"), toppEl = $("topp"), maxEl = $("max"), sysEl = $("system"),
        saveBtn = $("save"), clearBtn = $("clear"),
        sendBtn = $("send"), inputEl = $("input"),
        msgEl = $("messages"), statusEl = $("status"),
        chatListEl = $("chat-list"), newChatBtn = $("new-chat-btn");

  function loadCfg() {
    apiUrl.value = cfg.apiUrl; apiKey.value = cfg.apiKey; modelEl.value = cfg.model;
    tempEl.value = cfg.temp; toppEl.value = cfg.topp; maxEl.value = cfg.max; sysEl.value = cfg.system;
  }
  function currentChat() {
    return chats.find(c => c.id === currentChatId) || chats[0];
  }
  function saveChats() {
    SS("1kw-chat-chats", chats);
    SS("1kw-chat-current", currentChatId);
  }
  function renderSidebar() {
    chatListEl.innerHTML = "";
    for (const c of chats) {
      const li = document.createElement("li");
      li.className = "chat-item" + (c.id === currentChatId ? " active" : "");
      li.textContent = c.title || "新對話";
      li.onclick = () => switchChat(c.id);
      chatListEl.appendChild(li);
    }
  }
  function switchChat(id) {
    currentChatId = id;
    saveChats();
    renderSidebar();
    renderMessages();
  }
  function newChat() {
    const id = "c" + Date.now();
    chats.unshift({ id, title: "新對話 " + (chats.length), messages: [] });
    currentChatId = id;
    saveChats();
    renderSidebar();
    renderMessages();
    inputEl.focus();
  }

  function renderMessages() {
    const chat = currentChat();
    msgEl.innerHTML = "";
    const msgs = chat.messages;
    if (msgs.length === 0) {
      const div = document.createElement("div");
      div.className = "msg system";
      div.textContent = "說點什麼吧 ✨";
      msgEl.appendChild(div);
      return;
    }
    for (const m of msgs) msgEl.appendChild(renderMsg(m));
    msgEl.scrollTop = msgEl.scrollHeight;
  }
  function renderMsg(m) {
    const div = document.createElement("div");
    div.className = "msg " + (m.role === "user" ? "user" : m.role === "assistant" ? "assistant" : m.role === "error" ? "error" : "system");
    if (m.role === "assistant" && m.streaming) div.classList.add("streaming-cursor");
    const pre = document.createElement("pre");
    pre.textContent = m.content;
    div.appendChild(pre);
    return div;
  }
  function appendMsg(m) {
    const chat = currentChat();
    chat.messages.push(m);
    saveChats();
    if (chat.messages.length === 1 && m.role === "user") {
      chat.title = m.content.slice(0, 20);
      renderSidebar();
    }
    if (m.role !== "system") {
      const placeholder = msgEl.querySelector(".msg.system");
      if (placeholder) placeholder.remove();
    }
    msgEl.appendChild(renderMsg(m));
    msgEl.scrollTop = msgEl.scrollHeight;
    return msgEl.lastChild;
  }
  function updateLastAssistant(content, streaming) {
    const chat = currentChat();
    const last = chat.messages[chat.messages.length - 1];
    if (!last || last.role !== "assistant") return;
    last.content = content;
    last.streaming = streaming;
    saveChats();
    const nodes = msgEl.children;
    const node = nodes[nodes.length - 1];
    if (node) {
      node.classList.toggle("streaming-cursor", !!streaming);
      node.querySelector("pre").textContent = content;
      msgEl.scrollTop = msgEl.scrollHeight;
    }
  }

  // -------- API --------
  async function checkHealth() {
    try {
      const base = cfg.apiUrl.replace(/\/v1\/?$/, "");
      const r = await fetch(base + "/health", { cache: "no-store" });
      statusEl.textContent = r.ok ? "已連線" : "服務異常";
      statusEl.className = r.ok ? "online" : "offline";
      return r.ok;
    } catch (e) {
      statusEl.textContent = "離線";
      statusEl.className = "offline";
      return false;
    }
  }
  async function loadModels() {
    try {
      const headers = cfg.apiKey ? { "Authorization": "Bearer " + cfg.apiKey } : {};
      const r = await fetch(cfg.apiUrl + "/models", { headers, cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      models = (j.data || []).map(m => m.id);
      if (!cfg.model && models.length) cfg.model = models[0];
      modelEl.placeholder = models.length ? models.join(" / ") : "(輸入模型名)";
      modelEl.value = cfg.model;
    } catch (e) {
      // silently fail — manual input still works
    }
  }

  async function send() {
    if (streaming) return;
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = ""; inputEl.style.height = "auto";

    appendMsg({ role: "user", content: text });
    appendMsg({ role: "assistant", content: "", streaming: true });

    const chat = currentChat();
    const body = {
      model: cfg.model || "default",
      messages: [
        ...(cfg.system ? [{ role: "system", content: cfg.system }] : []),
        ...chat.messages.filter(m => m.role === "user" || m.role === "assistant").slice(0, -1).concat([{ role: "user", content: text }]),
      ],
      stream: true,
      temperature: parseFloat(cfg.temp) || 0.6,
      top_p: parseFloat(cfg.topp) || 0.95,
      max_tokens: parseInt(cfg.max, 10) || 4096,
    };
    const headers = { "Content-Type": "application/json" };
    if (cfg.apiKey) headers["Authorization"] = "Bearer " + cfg.apiKey;

    streaming = true; sendBtn.disabled = true;
    try {
      const r = await fetch(cfg.apiUrl + "/chat/completions", { method: "POST", headers, body: JSON.stringify(body) });
      if (!r.ok || !r.body) {
        const errText = await r.text().catch(() => "");
        updateLastAssistant("❌ " + r.status + " " + (errText || r.statusText), false);
        chat.messages[chat.messages.length - 1].role = "error";
        saveChats();
        msgEl.lastChild.className = "msg error";
        return;
      }
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = "", full = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 1);
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (data === "[DONE]") continue;
          try {
            const j = JSON.parse(data);
            const delta = j.choices?.[0]?.delta?.content || "";
            if (delta) { full += delta; updateLastAssistant(full, true); }
          } catch {}
        }
      }
      updateLastAssistant(full, false);
      checkHealth();
    } catch (e) {
      updateLastAssistant("❌ " + e.message, false);
      chat.messages[chat.messages.length - 1].role = "error";
      saveChats();
      msgEl.lastChild.className = "msg error";
    } finally {
      streaming = false; sendBtn.disabled = false;
    }
  }

  // -------- Keyboard viewport handling --------
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", () => {
      const kbOpen = window.innerHeight - window.visualViewport.height > 100;
      if (kbOpen) {
        document.body.classList.add("keyboard-open");
        document.body.style.setProperty("--kb-height", (window.innerHeight - window.visualViewport.height) + "px");
      } else {
        document.body.classList.remove("keyboard-open");
        document.body.style.removeProperty("--kb-height");
      }
      msgEl.scrollTop = msgEl.scrollHeight;
    });
  }

  // -------- Events --------
  // 設定區摺疊切換
  document.querySelector(".settings-toggle").onclick = () => {
    document.getElementById("settings-inline").classList.toggle("collapsed");
  };

  saveBtn.onclick = () => {
    cfg = {
      apiUrl: apiUrl.value.trim().replace(/\/+$/, "") || cfg.apiUrl,
      apiKey: apiKey.value.trim(),
      model: modelEl.value.trim(),
      temp: parseFloat(tempEl.value),
      topp: parseFloat(toppEl.value),
      max: parseInt(maxEl.value, 10),
      system: sysEl.value,
    };
    SS("1kw-chat-cfg", cfg);
    saveBtn.textContent = "✓ 儲存";
    setTimeout(() => saveBtn.textContent = "儲存", 1200);
    checkHealth(); loadModels();
  };
  clearBtn.onclick = () => {
    if (!confirm("清空目前對話？")) return;
    const chat = currentChat();
    chat.messages = [];
    saveChats();
    renderMessages();
  };
  newChatBtn.onclick = newChat;
  sendBtn.onclick = send;
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  });

  // -------- Boot --------
  loadCfg(); renderSidebar(); renderMessages();
  checkHealth(); loadModels();
  setInterval(checkHealth, 30000);

  // PWA: register service worker for offline shell
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
